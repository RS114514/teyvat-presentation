<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/png" href="favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>《原神》5分钟提瓦特全景交互课件 | 希沃大屏杂志级交互版</title>

  <!-- 引入 10 大页面杂志级差异化布局与风景通透样式表 -->
  <link rel="stylesheet" href="module_layouts.css">

  <!-- 引入游戏原汁原味专属转场样式库 -->
  <link rel="stylesheet" href="module_transitions.css">

  <style>
    /* ==========================================================================
       1. 全局设计变量与希沃大屏抗锯齿优化
       ========================================================================== */
    :root {
      --color-anemo: #34e5a7;
      --color-geo: #f4c053;
      --color-electro: #ca7cff;
      --color-dendro: #9de337;
      --color-hydro: #2ec5ff;
      --color-pyro: #ff5722;
      --color-cryo: #9ee6ff;
      --color-celestia: #dfb2ff;

      --active-element: var(--color-celestia);
      --active-rgb: 223, 178, 255;

      --font-display: -apple-system, BlinkMacSystemFont, "Cinzel", "Times New Roman", "Songti SC", "Noto Serif SC", serif;
      --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #06080d;
      font-family: var(--font-body);
      color: #f3f4f6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 希沃大屏 16:9 画幅视口容器 */
    #deck-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      perspective: 1400px;
    }

    /* ==========================================================================
       2. 双缓冲 DOM 视窗架构 (Double-Buffered Viewport System)
       ========================================================================== */
    .deck-viewport {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* 当前展示层 */
    .deck-viewport-current {
      opacity: 1;
      z-index: 20;
      pointer-events: auto;
      transform: scale(1) translateZ(0);
    }

    /* 下一页准备层 */
    .deck-viewport-incoming {
      opacity: 0;
      z-index: 10;
      pointer-events: none;
      transform: scale(1.04) translateZ(-40px);
    }

    /* ==========================================================================
       3. 层次空间景深系统 (Visual Depth System)
       ========================================================================== */
    /* Layer 1: 全景风景底图 (彻底移除死黑覆盖，通透明亮，视距优化) */
    .layer-scenery {
      position: absolute;
      inset: -2%;
      width: 104%;
      height: 104%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: contrast(1.10) saturate(1.18) brightness(1.04);
      transform: translate3d(0, 0, 0);
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
      z-index: 1;
    }

    /* 遮罩优化：严格控制暗角遮罩在 35%~45% 范围，保证 2.5K 超清风景后排清晰可见 */
    .layer-scenery::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(6, 8, 14, 0.44) 0%, rgba(6, 8, 14, 0.35) 42%, rgba(6, 8, 14, 0.16) 75%, rgba(6, 8, 14, 0.08) 100%),
                  radial-gradient(circle at 62% 50%, transparent 42%, rgba(6, 8, 14, 0.38) 100%);
      pointer-events: none;
    }

    /* 至冬极寒北境夜空左上角暗晕优化：自然融入极夜星空，隐去底图原生微标 */
    .slide-snezhnaya .layer-scenery::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 32vw;
      height: 25vh;
      background: radial-gradient(ellipse at 0% 0%, rgba(6, 10, 20, 0.98) 0%, rgba(6, 10, 20, 0.88) 48%, transparent 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Layer 2: 杂志化超大英文半透明背景水印 */
    .layer-watermark {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 4vw;
      overflow: hidden;
    }

    .watermark-text {
      font-family: var(--font-display);
      font-size: clamp(6.5rem, 16vw, 16rem);
      font-weight: 900;
      line-height: 0.82;
      letter-spacing: -0.04em;
      color: rgba(255, 255, 255, 0.05);
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.10);
      white-space: nowrap;
      text-transform: uppercase;
      transform: translate3d(0, 0, 0);
    }

    /* Layer 3: 免抠神明立绘与角色穿透排版容器 */
    .layer-character-wrap {
      position: absolute;
      top: 0;
      right: 2vw;
      width: 48vw;
      height: 100vh;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
    }

    /* 角色背景专属同心柔和元素光晕 (纯 CSS，零 3D 依赖) */
    .layer-character-wrap::before {
      content: "";
      position: absolute;
      width: clamp(380px, 42vw, 680px);
      height: clamp(380px, 42vw, 680px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--active-rgb), 0.28) 0%, rgba(var(--active-rgb), 0.08) 45%, transparent 70%);
      filter: blur(32px);
      pointer-events: none;
      z-index: 1;
    }

    /* 立体角色舞台与触控倾斜容器 */
    .character-stage {
      position: relative;
      width: 100%;
      height: 86vh;
      max-height: 920px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      z-index: 6;
      pointer-events: auto;
      cursor: default;
    }

    .character-visual {
      position: relative;
      height: 85vh;
      max-height: 920px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 45px rgba(var(--active-rgb), 0.32));
      animation: charFloat 5.5s ease-in-out infinite alternate;
      will-change: transform;
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.25, 1);
      transform-style: preserve-3d;
      pointer-events: auto;
    }

    @keyframes charFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(0.6deg); }
      100% { transform: translateY(4px) rotate(-0.4deg); }
    }

    /* 角色身份印牌 (Archon Placard) */
    .archon-placard {
      position: absolute;
      bottom: 6.8vh;
      left: 1vw;
      background: rgba(10, 15, 26, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-left: 3.5px solid var(--active-element);
      padding: 8px 18px;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      z-index: 10;
      transition: border-color 0.5s ease;
    }

    .placard-nation {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--active-element);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .placard-title-cn {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .placard-title-en {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
      margin-top: 1px;
    }

    /* ==========================================================================
       4. 四大杂志级排版矩阵 (Layout Matrices: A / B / C / D / Epilogue)
       ========================================================================== */

    /* --------------------------------------------------------------------------
       Layout A: 经典非对称穿透式 (叙事左 56vw, 立绘右 44vw)
       -------------------------------------------------------------------------- */
    .layout-A .layer-narrative {
      position: absolute;
      top: 9vh;
      left: 6vw;
      width: 50vw;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 1.6vh;
      pointer-events: auto;
    }

    /* --------------------------------------------------------------------------
       Layout B: 纳塔 50/50 烈火与部族张力分屏式
       -------------------------------------------------------------------------- */
    .layout-B .natlan-split-container {
      position: absolute;
      inset: 0;
      display: flex;
      width: 100vw;
      height: 100vh;
      z-index: 4;
      pointer-events: none;
    }

    .layout-B .split-half-left {
      width: 50vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      border-right: 2px solid rgba(255, 87, 34, 0.5);
      box-shadow: 10px 0 40px rgba(255, 87, 34, 0.3);
    }

    .layout-B .split-half-right {
      width: 50vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 70% 50%, rgba(255, 138, 76, 0.15) 0%, transparent 70%);
    }

    .layout-B .layer-narrative {
      position: absolute;
      top: 9vh;
      left: 4.5vw;
      width: 32vw;
      max-width: 500px;
      z-index: 12;
      display: flex;
      flex-direction: column;
      gap: 1.6vh;
      pointer-events: auto;
      background: transparent;
      backdrop-filter: none;
      padding: 0;
      border: none;
      box-shadow: none;
    }

    /* --------------------------------------------------------------------------
       Layout C: 戏曲宽银幕舞台长卷式 (《神女劈观》云堇与申鹤对望拱卫)
       -------------------------------------------------------------------------- */
    .layout-C .opera-stage-banner {
      position: absolute;
      top: 6vh;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      max-width: 1200px;
      text-align: center;
      z-index: 12;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .layout-C .opera-character-left {
      position: absolute;
      bottom: 0;
      left: 1.5vw;
      width: 32vw;
      height: 82vh;
      z-index: 7;
      pointer-events: auto;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }

    .layout-C .opera-character-right {
      position: absolute;
      bottom: 0;
      right: 1.5vw;
      width: 32vw;
      height: 82vh;
      z-index: 7;
      pointer-events: auto;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }

    .layout-C .opera-character-img {
      height: 80vh;
      max-height: 850px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 35px rgba(245, 158, 11, 0.35));
      animation: charFloat 5s ease-in-out infinite alternate;
    }

    .layout-C .opera-keypoints-row {
      position: absolute;
      bottom: 15vh;
      left: 50%;
      transform: translateX(-50%);
      width: 58vw;
      max-width: 960px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      z-index: 12;
      pointer-events: auto;
    }

    .layout-C .opera-keypoint-card {
      background: transparent;
      backdrop-filter: none;
      border: none;
      border-left: 3px solid rgba(245, 158, 11, 0.85);
      border-radius: 0;
      padding: 8px 16px;
      box-shadow: none;
      transition: transform 0.25s ease;
    }

    .layout-C .layer-narrative {
      position: absolute;
      top: auto;
      bottom: 4.5vh;
      left: 50%;
      transform: translateX(-50%);
      width: 56vw;
      max-width: 900px;
      z-index: 12;
      pointer-events: auto;
    }

    /* --------------------------------------------------------------------------
       Layout D: 智慧之树垂直流线排版 (须弥生命藤蔓与阶梯要点)
       -------------------------------------------------------------------------- */
    .layout-D .dendro-lifeline {
      position: absolute;
      left: 5vw;
      top: 10vh;
      bottom: 8vh;
      width: 3px;
      background: linear-gradient(to bottom, #9de337, rgba(157, 227, 55, 0.2));
      box-shadow: 0 0 15px rgba(157, 227, 55, 0.7);
      z-index: 9;
    }

    .layout-D .layer-narrative {
      position: absolute;
      top: 9vh;
      left: 7.5vw;
      width: 48vw;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 1.6vh;
      pointer-events: auto;
    }

    .layout-D .keypoint-item:nth-child(1) { margin-left: 0; }
    .layout-D .keypoint-item:nth-child(2) { margin-left: 1.8vw; }
    .layout-D .keypoint-item:nth-child(3) { margin-left: 3.6vw; }

    /* --------------------------------------------------------------------------
       Slide 10: 结语殿堂级排版 (文明之桥 · 双生旅行者与创作者名牌)
       -------------------------------------------------------------------------- */
    .layout-epilogue .layer-narrative {
      position: absolute;
      top: 9vh;
      left: 6vw;
      width: 46vw;
      z-index: 12;
      display: flex;
      flex-direction: column;
      gap: 1.8vh;
      pointer-events: auto;
    }

    .layout-epilogue .epilogue-dual-travelers {
      position: absolute;
      top: 0;
      right: 2vw;
      width: 48vw;
      height: 100vh;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .layout-epilogue .traveler-img {
      height: 80vh;
      max-height: 840px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 20px 45px rgba(0,0,0,0.85)) drop-shadow(0 0 40px rgba(223, 178, 255, 0.35));
      animation: charFloat 5s ease-in-out infinite alternate;
    }
    .layout-epilogue .traveler-lumine {
      margin-right: -7vw;
      z-index: 7;
    }
    .layout-epilogue .traveler-aether {
      z-index: 6;
    }

    /* 创作者殿堂印章卡 (黄金比例右下浮动排版) */
    .epilogue-creator-plaque {
      position: absolute;
      bottom: 7vh;
      right: 3vw;
      display: flex;
      align-items: center;
      gap: 24px;
      background: rgba(12, 16, 26, 0.82);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(223, 178, 255, 0.45);
      border-radius: 12px;
      padding: 14px 26px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 30px rgba(223, 178, 255, 0.2);
      z-index: 15;
      pointer-events: auto;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .epilogue-creator-plaque:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8), 0 0 45px rgba(223, 178, 255, 0.35);
    }

    .creator-column {
      display: flex;
      flex-direction: column;
    }

    .creator-role {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--color-celestia);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .creator-name {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .creator-divider-line {
      width: 1px;
      height: 38px;
      background: rgba(255, 255, 255, 0.18);
    }

    /* ==========================================================================
       5. 文本与要点排版规范 (75% 英文主体 + 25% 辅助中文)
       ========================================================================== */
    .badge-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .badge-element {
      background: rgba(var(--active-rgb), 0.18);
      border: 1px solid rgba(var(--active-rgb), 0.5);
      color: var(--active-element);
    }

    .badge-culture {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #cbd5e1;
    }

    .title-group {
      margin-top: 0.4vh;
    }

    .slide-main-title {
      font-family: var(--font-display);
      font-size: clamp(2.1rem, 3.2vw, 3.6rem);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      text-transform: uppercase;
    }

    .slide-sub-title {
      font-size: clamp(1rem, 1.25vw, 1.35rem);
      font-weight: 500;
      letter-spacing: 2px;
      color: #94a3b8;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .slide-sub-title::before {
      content: "";
      display: inline-block;
      width: 14px;
      height: 2px;
      background: var(--active-element);
    }

    .gold-divider {
      width: 100%;
      max-width: 520px;
      height: 14px;
      background: url('genshin_interactive_assets/ui/ui_genshin_divider.svg') no-repeat left center;
      background-size: contain;
      margin: 0.3vh 0;
      opacity: 0.9;
      filter: drop-shadow(0 0 6px rgba(var(--active-rgb), 0.45));
    }

    .element-badge-svg {
      width: 15px;
      height: 15px;
      object-fit: contain;
      vertical-align: middle;
      filter: drop-shadow(0 0 5px var(--active-element));
    }

    /* 3 大核心要点错落排版 */
    .keypoints-list {
      display: flex;
      flex-direction: column;
      gap: 1.2vh;
    }

    .keypoint-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: rgba(12, 18, 32, 0.62);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-left: 3.5px solid var(--active-element);
      border-radius: 10px;
      padding: 13px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }
    .keypoint-item:hover {
      transform: translateX(8px);
      border-color: rgba(var(--active-rgb), 0.55);
      background: rgba(15, 24, 44, 0.82);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), 0 0 25px rgba(var(--active-rgb), 0.22);
    }

    .keypoint-num {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 900;
      color: var(--active-element);
      background: rgba(var(--active-rgb), 0.18);
      padding: 3px 9px;
      border-radius: 6px;
      line-height: 1.2;
      letter-spacing: 0.5px;
    }

    .keypoint-content {
      flex: 1;
    }

    .keypoint-en {
      font-size: 30px !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      line-height: 1.25 !important;
      letter-spacing: 0.01em !important;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.95), 0 0 24px rgba(0, 0, 0, 0.8) !important;
    }

    .keypoint-cn {
      font-size: 18px !important;
      font-weight: 600 !important;
      color: rgba(253, 230, 138, 0.98) !important;
      margin-top: 5px !important;
      line-height: 1.4 !important;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95) !important;
    }

    /* 独立触控悬浮演讲提词胶囊与半透明抽屉 (Speaker Cue Floating System) */
    
    .bottombar-cue-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-right: 8px;
      user-select: none;
    }
    .bottombar-cue-pill:hover {
      background: rgba(var(--active-rgb), 0.25);
      border-color: var(--active-element);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* 独立触控悬浮背景音乐控制胶囊与动态声波 (BGM Audio Floating System) */
    .bottombar-audio-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-right: 8px;
      user-select: none;
    }
    .bottombar-audio-pill:hover {
      background: rgba(var(--active-rgb), 0.25);
      border-color: var(--active-element);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .bottombar-audio-pill.playing {
      background: rgba(var(--active-rgb), 0.2);
      border-color: var(--active-element);

    .speaker-cue-toggle {
      position: fixed;

      background: rgba(var(--active-rgb), 0.25);

      transform: translateY(-2px);

    .speaker-cue-drawer {
      position: fixed;
      bottom: 96px;
      left: 3vw;
      width: clamp(380px, 44vw, 700px);
      background: rgba(8, 12, 22, 0.94);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(var(--active-rgb), 0.45);

    .speaker-cue-header {

    .speaker-cue-close:hover {

    .speaker-cue-body {
      font-size: clamp(0.88rem, 0.98vw, 1.05rem);

    /* 封面专属名牌卡 */
    .cover-credits-card {

    /* ==========================================================================
       6. 顶部与底部全局控制栏 (Chrome TopBar & BottomBar)

    .chrome-topbar {

      left: 0;

    /* 底部全局控制栏 */

    .ruler-tick.active {

    .slide-counter {

    /* 希沃大屏舒适触控翻页大键 (80×80px) */
    .seewo-touch-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.7);

      align-items: center;

    }
    .seewo-touch-btn:hover {

    }
    .seewo-touch-prev { left: 1.5vw; }
    .seewo-touch-next { right: 1.5vw; }

    /* ==========================================================================
       7. 真实游戏视觉资产驱动转场系统 (Mix-Blend-Mode: Screen)
       ========================================================================== */
    .cinematic-trans-layer {
      position: fixed;
      inset: 0;
      z-index: 80;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      will-change: opacity, transform;
    }
    .cinematic-trans-layer.active {
      opacity: 1;
    }

    /* 7.1 蒙德千风 (青色风刃割裂 + 风之羽毛) */
    #trans-wind.active .wind-blade-cross-1 {
      position: absolute;
      width: 140vw;
      height: 12px;
      background: linear-gradient(90deg, transparent, #34e5a7, #fff, #34e5a7, transparent);
      box-shadow: 0 0 35px #34e5a7, 0 0 70px #34e5a7;
      transform: rotate(-32deg);
      animation: windSlash1 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #trans-wind.active .wind-blade-cross-2 {
      position: absolute;
      width: 140vw;
      height: 8px;
      background: linear-gradient(90deg, transparent, #2dd4bf, #fff, #2dd4bf, transparent);
      box-shadow: 0 0 30px #2dd4bf;
      transform: rotate(35deg);
      animation: windSlash2 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #trans-wind.active .wind-crest-symbol {
      animation: crestExpand 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes windSlash1 {
      0% { transform: rotate(-32deg) translateX(-100vw); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: rotate(-32deg) translateX(100vw); opacity: 0; }
    }
    @keyframes windSlash2 {
      0% { transform: rotate(35deg) translateX(100vw); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: rotate(35deg) translateX(-100vw); opacity: 0; }
    }
    @keyframes crestExpand {
      0% { transform: scale(0.3) rotate(0deg); opacity: 0; }
      50% { transform: scale(1.3) rotate(180deg); opacity: 1; filter: drop-shadow(0 0 45px currentColor); }
      100% { transform: scale(2.2) rotate(360deg); opacity: 0; }
    }

    /* 7.2 璃月天星下坠 (天星陨石实机虚影 + 六边形岩盾震颤) */
    #trans-rock.active .rock-meteor-core {
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, #fff 0%, #f4c053 45%, #b45309 80%, transparent 100%);
      box-shadow: 0 0 80px #f4c053, 0 0 160px #f59e0b;
      border-radius: 50%;
      animation: meteorImpact 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    #trans-rock.active .rock-hex-shield {
      position: absolute;
      width: 500px;
      height: 500px;
      border: 3px solid rgba(244, 192, 83, 0.85);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      box-shadow: 0 0 50px rgba(244, 192, 83, 0.7), inset 0 0 40px rgba(244, 192, 83, 0.4);
      animation: shieldPulse 0.75s ease-out forwards;
    }
    @keyframes meteorImpact {
      0% { transform: translate3d(0, -70vh, 0) scale(0.4); opacity: 0; }
      45% { transform: translate3d(0, 0, 0) scale(1.2); opacity: 1; }
      100% { transform: translate3d(0, 20vh, 0) scale(2.8); opacity: 0; }
    }
    @keyframes shieldPulse {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(2.0); opacity: 0; }
    }

    /* 7.3 稻妻雷神无想一刀 (紫白电弧切线 + 雷云威压闪烁) */
    #trans-slash.active .slash-flash-screen {
      position: absolute;
      inset: 0;
      background: #7e22ce;
      animation: slashFlash 0.75s ease-out forwards;
    }
    #trans-slash.active .slash-beam-line {
      position: absolute;
      width: 150vw;
      height: 16px;
      background: linear-gradient(90deg, transparent, #ca7cff, #fff, #ca7cff, transparent);
      box-shadow: 0 0 40px #ca7cff, 0 0 90px #9333ea, 0 0 150px #fff;
      transform: rotate(-28deg);
      animation: slashBeam 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slashFlash {
      0% { opacity: 0; }
      20% { opacity: 0.95; }
      40% { opacity: 0.3; }
      60% { opacity: 0.8; }
      100% { opacity: 0; }
    }
    @keyframes slashBeam {
      0% { transform: rotate(-28deg) scaleX(0.1); opacity: 0; }
      35% { transform: rotate(-28deg) scaleX(1); opacity: 1; }
      100% { transform: rotate(-28deg) scaleX(1.3) translateY(40px); opacity: 0; }
    }

    /* 7.4 须弥草神心景幻成 (绿色全息扫描 + 智慧叶脉展开) */
    #trans-dendro.active .dendro-scan-grid {
      position: absolute;
      width: 650px;
      height: 650px;
      border: 2px solid rgba(157, 227, 55, 0.7);
      border-radius: 50%;
      box-shadow: 0 0 60px rgba(157, 227, 55, 0.6), inset 0 0 50px rgba(157, 227, 55, 0.4);
      animation: dendroScan 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes dendroScan {
      0% { transform: scale(0.2); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* 7.5 枫丹歌剧院水幕双向拉帷 */
    #trans-hydro.active .hydro-curtain-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 50vw;
      height: 100vh;
      background: linear-gradient(to right, rgba(46, 197, 255, 0.85), transparent);
      box-shadow: 0 0 50px #2ec5ff;
      animation: curtainLeft 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #trans-hydro.active .hydro-curtain-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 50vw;
      height: 100vh;
      background: linear-gradient(to left, rgba(46, 197, 255, 0.85), transparent);
      box-shadow: 0 0 50px #2ec5ff;
      animation: curtainRight 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes curtainLeft {
      0% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(-50vw); opacity: 0; }
    }
    @keyframes curtainRight {
      0% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(50vw); opacity: 0; }
    }

    /* 7.6 纳塔部族圣火与熔岩龙息爆发 */
    #trans-pyro.active .pyro-blast-core {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #fff 0%, #ff5722 45%, #b91c1c 80%, transparent 100%);
      box-shadow: 0 0 90px #ff5722, 0 0 180px #ea580c;
      border-radius: 50%;
      animation: pyroBlast 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes pyroBlast {
      0% { transform: scale(0.2); opacity: 0; }
      40% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(3.0); opacity: 0; }
    }

    /* 7.7 至冬极地暴风雪与严寒破冰 */
    #trans-cryo.active .cryo-ice-shard {
      position: absolute;
      width: 140vw;
      height: 140vh;
      background: radial-gradient(circle, transparent 40%, rgba(158, 230, 255, 0.5) 75%, rgba(158, 230, 255, 0.9) 100%);
      box-shadow: inset 0 0 80px #9ee6ff;
      animation: cryoFreeze 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes cryoFreeze {
      0% { transform: scale(1.3); opacity: 0; }
      40% { transform: scale(1.0); opacity: 1; }
      100% { transform: scale(0.85); opacity: 0; }
    }

    /* 7.8 神女劈观双向红绸与传统水墨晕染 */
    #trans-opera.active .opera-ink-circle {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, #ef4444 0%, #991b1b 60%, transparent 100%);
      box-shadow: 0 0 60px #ef4444;
      animation: inkBloom 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #trans-opera.active .opera-ribbon-left {
      position: absolute;
      width: 100vw;
      height: 40px;
      background: linear-gradient(90deg, transparent, #ef4444, #fca5a5, transparent);
      box-shadow: 0 0 40px #ef4444;
      transform: rotate(-15deg);
      animation: ribbonFlow 0.75s ease-out forwards;
    }
    @keyframes inkBloom {
      0% { transform: scale(0.2); opacity: 0; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes ribbonFlow {
      0% { transform: rotate(-15deg) translateX(-80vw); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: rotate(-15deg) translateX(80vw); opacity: 0; }
    }

    /* 7.9 结语七元素同心圆与星盘引爆 */
    #trans-celestia.active .celestia-ring-blast {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      border: 3px solid rgba(223, 178, 255, 0.9);
      box-shadow: 0 0 80px rgba(223, 178, 255, 0.9), inset 0 0 60px rgba(223, 178, 255, 0.6);
      animation: celestiaBurst 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes celestiaBurst {
      0% { transform: scale(0.2); opacity: 0; }
      45% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(2.6); opacity: 0; }

    /* 瞬黑遮罩 */
    #blackout-mask {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #blackout-mask.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* 震屏动效 */
    .screen-shake {
      animation: screenShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes screenShake {
      10%, 90% { transform: translate3d(-3px, 2px, 0); }
      20%, 80% { transform: translate3d(4px, -3px, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 3px, 0); }
      40%, 60% { transform: translate3d(5px, -2px, 0); }
    }

    /* Stagger 错落入场动效 */
    .stagger-in {
      animation: staggerSlideIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;

    @keyframes staggerSlideIn {
      from {

      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);

    // ==========================================================================
    // 沉浸式提瓦特音频引擎 (轻柔小声 BGM + 翻页与五星转场音效 + 自动解锁)
    // ==========================================================================
    class GenshinAudioManager {
      constructor() {
        this.bgmVolume = 0.16; // 小声舒适的提瓦特背景音乐，不抢人声
        this.sfxVolume = 0.22; // 清脆提瓦特 UI 翻页音效
        this.isMuted = false;
        this.hasInteracted = false;
        this.fadeTimer = null;

        // BGM 元素初始化
        this.bgm = new Audio();
        this.bgm.loop = true;
        this.bgm.volume = 0; // 初始为 0，随后平滑淡入
        this.bgm.preload = 'auto';

        // 优先使用 mp3，ogg 作为全平台兼容备选
        const canPlayMp3 = this.bgm.canPlayType('audio/mpeg') !== '';
        this.bgmSrc = canPlayMp3 
          ? 'genshin_interactive_assets/audio/bgm/welkin_moon_progeny.mp3' 
          : 'genshin_interactive_assets/audio/bgm/welkin_moon_progeny.ogg';
        this.sfxSrc = canPlayMp3 
          ? 'genshin_interactive_assets/audio/sfx/ui_result_list.mp3' 
          : 'genshin_interactive_assets/audio/sfx/ui_result_list.ogg';
        this.starSrc = canPlayMp3 
          ? 'genshin_interactive_assets/audio/sfx/ui_gacha_reveal_5star.mp3' 
          : 'genshin_interactive_assets/audio/sfx/ui_gacha_reveal_5star.ogg';

        this.bgm.src = this.bgmSrc;

        this.btnPill = document.getElementById('audio-toggle-btn');
        this.setupAutoplayUnlock();
        this.updatePillUI(false);
      }

      setupAutoplayUnlock() {
        // 尝试首次直接以极小音量播放 (针对部分一体机白名单环境)
        const playPromise = this.bgm.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            this.fadeInBgm();
            this.updatePillUI(true);
            this.hasInteracted = true;
          }).catch(() => {
            // 现代浏览器 Autoplay Policy 拦截，等待首次全局手势交互
            const unlockAudio = () => {
              if (this.hasInteracted) return;
              this.hasInteracted = true;
              this.playBgm();
              window.removeEventListener('pointerdown', unlockAudio);
              window.removeEventListener('touchstart', unlockAudio);
              window.removeEventListener('click', unlockAudio);
              window.removeEventListener('keydown', unlockAudio);
            };
            window.addEventListener('pointerdown', unlockAudio, { once: true });
            window.addEventListener('touchstart', unlockAudio, { once: true });
            window.addEventListener('click', unlockAudio, { once: true });
            window.addEventListener('keydown', unlockAudio, { once: true });
          });
        }
      }

      fadeInBgm(duration = 1200) {
        if (this.isMuted) return;
        if (this.fadeTimer) clearInterval(this.fadeTimer);
        const start = this.bgm.volume;
        const target = this.bgmVolume;
        const startTime = Date.now();
        this.fadeTimer = setInterval(() => {
          const progress = Math.min((Date.now() - startTime) / duration, 1);
          this.bgm.volume = start + (target - start) * progress;
          if (progress >= 1) {
            clearInterval(this.fadeTimer);
            this.fadeTimer = null;
          }
        }, 50);
      }

      fadeOutBgm(duration = 500, callback) {
        if (this.fadeTimer) clearInterval(this.fadeTimer);
        const start = this.bgm.volume;
        const startTime = Date.now();
        this.fadeTimer = setInterval(() => {
          const progress = Math.min((Date.now() - startTime) / duration, 1);
          this.bgm.volume = Math.max(0, start * (1 - progress));
          if (progress >= 1) {
            clearInterval(this.fadeTimer);
            this.fadeTimer = null;
            if (callback) callback();
          }
        }, 50);
      }

      playBgm() {
        if (this.isMuted) return;
        this.bgm.play().then(() => {
          this.fadeInBgm();
          this.updatePillUI(true);
        }).catch((err) => {
          console.warn('Audio play notice:', err);
        });
      }

      pauseBgm() {
        this.fadeOutBgm(400, () => {
          this.bgm.pause();
          this.updatePillUI(false);
        });
      }

      toggleBgm() {
        this.playClickSfx();
        if (this.isMuted || this.bgm.paused) {
          this.isMuted = false;
          this.playBgm();
        } else {
          this.isMuted = true;
          this.pauseBgm();
        }
      }

      playSlideSfx(targetIdx) {
        if (this.isMuted) return;
        try {
          // Slide 10: 文化出海 · 神女劈观 触发专属五星金光音效
          if (targetIdx === 9) {
            const star = new Audio(this.starSrc);
            star.volume = 0.28;
            star.play().catch(() => {});
            return;
          }
          // 普通切页清脆音效
          const sfx = new Audio(this.sfxSrc);
          sfx.volume = this.sfxVolume;
          sfx.play().catch(() => {});
        } catch (e) {}
      }

      playClickSfx() {
        if (this.isMuted) return;
        try {
          const sfx = new Audio(this.sfxSrc);
          sfx.volume = 0.14;
          sfx.play().catch(() => {});
        } catch (e) {}
      }

      updatePillUI(isPlaying) {
        if (!this.btnPill) return;
        if (isPlaying && !this.isMuted) {
          this.btnPill.classList.add('playing');
          this.btnPill.innerHTML = `
            <div class="audio-wave-bars">
              <span class="audio-wave-bar"></span>
              <span class="audio-wave-bar"></span>
              <span class="audio-wave-bar"></span>
            </div>
            <span>BGM ♫</span>
          `;
          this.btnPill.title = "点击静音背景音乐 (快捷键 M)";
        } else {
          this.btnPill.classList.remove('playing');
          this.btnPill.innerHTML = `
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <line x1="23" y1="9" x2="17" y2="15"/>
              <line x1="17" y1="9" x2="23" y2="15"/>
            </svg>
            <span>静音 ✕</span>
          `;
          this.btnPill.title = "点击播放背景音乐 (快捷键 M)";
        }
      }
    }

    // ==========================================================================

              this.updateChrome();

            bindParallaxTilt(wrap, img) {
        if (!wrap || !img) return;
        const handleMove = (clientX, clientY) => {
          const rect = wrap.getBoundingClientRect();
          const x = (clientX - rect.left) / rect.width - 0.5;
          const y = (clientY - rect.top) / rect.height - 0.5;
          const rotY = Math.max(-16, Math.min(16, x * 26));
          const rotX = Math.max(-12, Math.min(12, -y * 20));
          img.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg) translateZ(28px)`;
        };

        wrap.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
        wrap.addEventListener('mouseleave', () => {
          img.style.transform = 'rotateY(0deg) rotateX(0deg) translateZ(0px)';
        });
      }

        if (fromIdx === 3 && toIdx === 4) return 'trans_04_05_dendro';
        if (fromIdx === 4 && toIdx === 5) return 'trans_05_06_hydro';
        if (fromIdx === 5 && toIdx === 6) return 'trans_06_07_pyro';
        if (fromIdx === 6 && toIdx === 7) return 'trans_07_08_lunar';
        if (fromIdx === 7 && toIdx === 8) return 'trans_08_09_cryo';
        if (fromIdx === 8 && toIdx === 9) return 'trans_09_10_opera';
        if (fromIdx === 9 && toIdx === 10) return 'trans_10_11_celestia';
        if (fromIdx === 10 && toIdx === 11) return 'trans_11_12_electro';
        return null;
      }

      // 核心平滑双缓冲转场调度器 (Strict Double-Buffered Stagger Timeline)
      goto(nextIndex) {
        if (this.transitionEngine) {
          if (this.transitionEngine.isBusy() || nextIndex === this.currentIndex) return;
          if (nextIndex < 0 || nextIndex >= this.slides.length) return;
          if (this.blackoutMask && this.blackoutMask.classList.contains('active')) {
            this.blackoutMask.classList.remove('active');
          }
          if (window.genshinAudio) {
            window.genshinAudio.playSlideSfx(nextIndex);
          }
          this.transitionEngine.goto(nextIndex);
          return;
        }

        if (this.isLocked || nextIndex === this.currentIndex) return;
        if (nextIndex < 0 || nextIndex >= this.slides.length) return;

        if (window.genshinAudio) {
          window.genshinAudio.playSlideSfx(nextIndex);
        }

        this.isLocked = true;
        const curIdx = this.currentIndex;
        const nxtIdx = nextIndex;
        const curSlide = this.slides[curIdx];
        const nxtSlide = this.slides[nxtIdx];

        // 1. T+0ms: 在 #viewport-incoming 中预渲染下一页全部结构
        this.renderSlide(this.viewportIncoming, nxtSlide);
        this.viewportIncoming.className = `deck-viewport deck-viewport-incoming layout-${nxtSlide.layout} slide-${nxtSlide.id}`;
        this.viewportIncoming.style.opacity = '0';
        this.viewportIncoming.style.transform = 'scale(1.05) translateZ(-40px)';
        this.viewportIncoming.style.transition = 'none';

        const transKey = this.getTransitionKey(curIdx, nxtIdx);
        const transLayer = transKey ? this.transLayers[transKey] : null;

        // 2. T+50ms: 触发游戏实机专属转场遮罩
        setTimeout(() => {
          if (transLayer) {
            transLayer.classList.add('active');
          }
          if (transKey === 'trans_02_03_rock') {
            this.container.classList.add('screen-shake');
          }
        }, 50);

        // 3. T+200ms: #viewport-current 淡出位移，#viewport-incoming 缓动淡入
        setTimeout(() => {
          this.viewportCurrent.style.transition = 'transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.55s ease';
          this.viewportIncoming.style.transition = 'transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.55s ease';

          this.viewportCurrent.style.opacity = '0';
          this.viewportCurrent.style.transform = nxtIdx > curIdx 
            ? 'scale(0.96) translate3d(-30px, 0, 0)' 
            : 'scale(0.96) translate3d(30px, 0, 0)';

          this.viewportIncoming.style.opacity = '1';
          this.viewportIncoming.style.transform = 'scale(1) translateZ(0)';

          // 更新全局配色
          document.documentElement.style.setProperty('--active-element', nxtSlide.elementColor);
          document.documentElement.style.setProperty('--active-rgb', nxtSlide.elementRgb);
        }, 200);

        // 4. T+450ms: 新页面标题与要点错落动效 (Stagger Delay 80ms)
        setTimeout(() => {
          const items = this.viewportIncoming.querySelectorAll('.keypoint-item, .opera-keypoint-card, .vlog-card');
          items.forEach((item, i) => {
            item.style.animationDelay = `${i * 80}ms`;
            item.classList.add('stagger-in');
          });
        }, 450);

        // 5. T+750ms: 转场结束，移除遮罩，交换双缓冲指针
        setTimeout(() => {
          if (transLayer) {
            transLayer.classList.remove('active');
          }
          this.container.classList.remove('screen-shake');

          // 无缝切换缓冲层指针
          const temp = this.viewportCurrent;
          this.viewportCurrent = this.viewportIncoming;
          this.viewportIncoming = temp;

          this.viewportCurrent.className = `deck-viewport deck-viewport-current layout-${nxtSlide.layout} slide-${nxtSlide.id}`;
          this.viewportIncoming.className = 'deck-viewport deck-viewport-incoming';
          this.viewportIncoming.style.opacity = '0';
          this.viewportIncoming.style.transform = 'scale(1.05) translateZ(-40px)';
          this.viewportIncoming.innerHTML = '';

          this.currentIndex = nxtIdx;
          this.updateChrome();
          this.isLocked = false;
        }, 750);
      }

      renderTimeline() {
        this.timelineRuler.innerHTML = '';
        this.slides.forEach((slide, idx) => {
          const tick = document.createElement('div');
          tick.className = `ruler-tick ${idx === 0 ? 'active' : ''}`;
          tick.title = `Slide ${idx + 1}: ${slide.mainTitle}`;
          tick.addEventListener('click', () => this.goto(idx));
          this.timelineRuler.appendChild(tick);
        });
      }

      updateChrome() {
        const ticks = this.timelineRuler.querySelectorAll('.ruler-tick');
        ticks.forEach((tick, idx) => {
          if (idx === this.currentIndex) tick.classList.add('active');
          else tick.classList.remove('active');
        });
        const cur = String(this.currentIndex + 1).padStart(2, '0');
        const tot = String(this.slides.length).padStart(2, '0');
        this.slideCounter.textContent = `${cur} / ${tot}`;
        this.topbarBreadcrumb.textContent = `${cur} · ${this.slides[this.currentIndex].subTitle.split('·')[0].trim()}`;

        // 同步更新悬浮抽屉中的演讲口播提示
        if (this.speakerCueText && this.slides[this.currentIndex]) {
          this.speakerCueText.textContent = this.slides[this.currentIndex].teleprompter || '';
        }
      }

      bindEvents() {
        window.addEventListener('keydown', (e) => {
          const key = e.key;
          const code = e.keyCode || e.which;

          // 1. 翻页笔“下一页”信号支持：PageDown, ArrowRight, ArrowDown, Space, Enter, N/n
          if (
            key === 'ArrowRight' || key === 'PageDown' || key === 'ArrowDown' ||
            key === ' ' || key === 'Enter' || key === 'n' || key === 'N' ||
            code === 34 || code === 39 || code === 40 || code === 32 || code === 13 || code === 78
          ) {
            e.preventDefault();
            this.goto(this.currentIndex + 1);
          }
          // 2. 翻页笔“上一页”信号支持：PageUp, ArrowLeft, ArrowUp, Backspace, P/p
          else if (
            key === 'ArrowLeft' || key === 'PageUp' || key === 'ArrowUp' ||
            key === 'Backspace' || key === 'p' || key === 'P' ||
            code === 33 || code === 37 || code === 38 || code === 8 || code === 80
          ) {
            e.preventDefault();
            this.goto(this.currentIndex - 1);
          }
          // 3. 翻页笔“黑屏/瞬黑”信号支持：b, B, Period (.), 句点键
          else if (key === 'b' || key === 'B' || key === '.' || code === 190 || code === 66) {
            e.preventDefault();
            this.blackoutMask.classList.toggle('active');
          }
          // 4. 翻页笔“全屏放映”信号支持：F5, f, F
          else if (key === 'F5' || key === 'f' || key === 'F' || code === 116 || code === 70) {
            e.preventDefault();
            if (!document.fullscreenElement) {
              document.documentElement.requestFullscreen().catch(() => {});
            } else {
              document.exitFullscreen().catch(() => {});
            }
          }
          // 5. 演讲提词器抽屉：t, T
          else if (key === 't' || key === 'T') {
            this.toggleSpeakerCue();
          }
          // 6. 背景音乐静音/开启快捷键：m, M
          else if (key === 'm' || key === 'M' || code === 77) {
            e.preventDefault();
            if (window.genshinAudio) {
              window.genshinAudio.toggleBgm();
            }
          }
          // 7. 退出全屏/关闭抽屉：Escape
          else if (key === 'Escape') {
            this.closeSpeakerCue();
          }
        });

        document.getElementById('btn-prev').addEventListener('click', () => this.goto(this.currentIndex - 1));
        document.getElementById('btn-next').addEventListener('click', () => this.goto(this.currentIndex + 1));
        document.getElementById('touch-btn-prev').addEventListener('click', () => this.goto(this.currentIndex - 1));
        document.getElementById('touch-btn-next').addEventListener('click', () => this.goto(this.currentIndex + 1));

        if (this.speakerCueBtn) {
          this.speakerCueBtn.addEventListener('click', () => this.toggleSpeakerCue());
        }
        if (this.speakerCueClose) {
          this.speakerCueClose.addEventListener('click', () => this.closeSpeakerCue());
        }

        const audioBtn = document.getElementById('audio-toggle-btn');
        if (audioBtn) {
          audioBtn.addEventListener('click', () => {
            if (window.genshinAudio) {
              window.genshinAudio.toggleBgm();
            }
          });
        }

        // 触控滑动换页
        let startX = 0, startY = 0;
        window.addEventListener('touchstart', (e) => {
          if (e.touches.length > 0) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
          }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
          if (e.changedTouches.length > 0) {
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
              if (dx < 0) this.goto(this.currentIndex + 1);
              else this.goto(this.currentIndex - 1);
            }
          }
        }, { passive: true });
      }
    }

    // 页面加载就绪后初始化课件
    document.addEventListener('DOMContentLoaded', () => {
      window.deckInstance = new PresentationEngine(SLIDES_DATA);
    });
  </script>
</body>
</html>
